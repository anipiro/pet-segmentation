<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Cutout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e9eef4;      /* studio backdrop */
    --surface: #ffffff;
    --ink: #1b2a41;
    --muted: #5b6b80;
    --line: #c9d2dd;
    --mark: #e8336d;       /* same pink the API paints on overlays */
    --check-a: #ffffff;
    --check-b: #dfe5ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141c28; --surface: #1d2737; --ink: #e8edf4; --muted: #9aa8ba;
      --line: #33415a; --mark: #ff5c8a; --check-a: #2a3547; --check-b: #222c3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 16px/1.5 "Schibsted Grotesk", system-ui, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 48px;
          display: grid; grid-template-columns: 340px 1fr; gap: 40px; }
  h1 { font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 12px; }
  .lede { color: var(--muted); margin: 0 0 28px; max-width: 34ch; }
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 28px 20px;
    text-align: center; cursor: pointer; background: var(--surface);
  }
  .drop:hover, .drop.over { border-color: var(--mark); }
  .drop:focus-within { outline: 3px solid var(--mark); outline-offset: 3px; }
  .drop strong { display: block; font-size: 18px; }
  .drop span { color: var(--muted); font-size: 14px; }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .samples { margin: 20px 0 0; }
  .samples p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .thumbs { display: flex; gap: 8px; }
  .thumbs button { padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden;
                   width: 64px; height: 64px; cursor: pointer; background: none; }
  .thumbs button:focus-visible, .thumbs button:hover { border-color: var(--mark); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  dl { margin: 28px 0 0; display: grid; grid-template-columns: 1fr auto; row-gap: 8px;
       border-top: 1px solid var(--line); padding-top: 16px; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
  .download {
    margin-top: 24px; display: inline-block; background: var(--ink); color: var(--paper);
    text-decoration: none; font-weight: 700; padding: 12px 18px; border-radius: 10px;
  }
  .download[aria-disabled="true"] { opacity: .35; pointer-events: none; }
  .download:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }
  .meta { margin-top: 28px; font-size: 13px; color: var(--muted); }

  .stage-col { min-width: 0; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tabs button {
    font: inherit; font-weight: 500; border: 0; background: transparent; color: var(--muted);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .tabs button:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
  .stage {
    position: relative; border-radius: 18px; overflow: hidden; background: var(--surface);
    aspect-ratio: 4 / 3; display: grid; place-items: center; container-type: size;
  }
  .stage .empty { color: var(--muted); text-align: center; padding: 24px; }
  /* scale the photo up or down to fit the stage; --ratio = width / height, set from JS */
  .frame { position: relative; line-height: 0; aspect-ratio: var(--ratio, 4 / 3);
           width: min(100cqw, 100cqh * var(--ratio, 1.333)); }
  .frame img { width: 100%; height: 100%; display: block; }
  .checker {
    background-color: var(--check-a);
    background-image: conic-gradient(var(--check-b) 25%, transparent 0 50%, var(--check-b) 0 75%, transparent 0);
    background-size: 20px 20px;
  }
  /* compare view: cutout on a checkerboard, original revealed left of the handle */
  .compare .top { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos, 50%)) 0 0); }
  .compare .top img { width: 100%; height: 100%; }
  .handle { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px;
            background: var(--mark); transform: translateX(-1px); pointer-events: none; }
  .handle::after { content: ""; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
                   border-radius: 50%; background: var(--mark); transform: translate(-50%, -50%); }
  .slider { width: 100%; margin-top: 12px; accent-color: var(--mark); }
  .status { min-height: 1.5em; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .status.error { color: var(--mark); }
  .busy .stage { opacity: .55; }

  @media (max-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 20px 16px 32px; }
    h1 { font-size: 34px; }
    .lede { margin-bottom: 20px; }
  }
</style>
</head>
<body>
<main class="wrap" id="app">
  <section>
    <h1>Pet cutout</h1>
    <p class="lede">Finds the cat or dog in a photo and removes the background. The model runs on this server's CPU.</p>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      <strong>Drop a photo here</strong>
      <span>or click to choose one (JPG, PNG, WebP)</span>
    </label>

    <div class="samples">
      <p>Or try a photo the model never saw during training:</p>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <dl>
      <dt>Pet area</dt><dd id="s-area">–</dd>
      <dt>Image size</dt><dd id="s-size">–</dd>
      <dt>Model time</dt><dd id="s-model">–</dd>
      <dt>Total time</dt><dd id="s-total">–</dd>
    </dl>
    <a class="download" id="download" download="cutout.png" aria-disabled="true" href="#">Download cutout PNG</a>
    <p class="meta" id="meta"></p>
  </section>

  <section class="stage-col">
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" aria-selected="true" data-view="compare">Compare</button>
      <button role="tab" aria-selected="false" data-view="overlay">Overlay</button>
      <button role="tab" aria-selected="false" data-view="mask">Mask</button>
    </div>
    <div class="stage" id="stage"><p class="empty">Your result appears here.</p></div>
    <input class="slider" id="slider" type="range" min="0" max="100" value="50" aria-label="Compare original and cutout" hidden>
    <p class="status" id="status" role="status"></p>
  </section>
</main>

<script>
// from the official test split, never used for training or model selection
const SAMPLES = ["Abyssinian_22", "Bombay_25", "beagle_199", "samoyed_20", "pug_22"];
const $ = (id) => document.getElementById(id);
let result = null, originalUrl = null, view = "compare";

fetch("/health").then(r => r.json()).then(h => {
  $("meta").textContent = `Model ${h.model}, ${h.input_size}×${h.input_size} px input`;
}).catch(() => {});

for (const name of SAMPLES) {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", `Use sample photo ${name.replace(/_\d+$/, "").replace(/_/g, " ")}`);
  b.innerHTML = `<img src="/static/samples/${name}.jpg" alt="">`;
  b.onclick = async () => run(await (await fetch(`/static/samples/${name}.jpg`)).blob());
  $("thumbs").append(b);
}

// ?sample=<name> opens the page with that sample already processed (shareable link)
const preset = new URLSearchParams(location.search).get("sample");
if (preset && SAMPLES.includes(preset)) {
  fetch(`/static/samples/${preset}.jpg`).then(r => r.blob()).then(run);
}

$("file").onchange = (e) => e.target.files[0] && run(e.target.files[0]);
const drop = $("drop");
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => {
  e.preventDefault(); drop.classList.remove("over");
  const f = e.dataTransfer.files[0];
  if (f) run(f);
};

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  render();
});
$("slider").oninput = (e) => $("stage").style.setProperty("--pos", e.target.value + "%");

async function run(blob) {
  const status = $("status");
  status.className = "status"; status.textContent = "Segmenting…";
  document.body.classList.add("busy");
  const form = new FormData();
  form.append("file", blob, blob.name || "image.jpg");
  try {
    const r = await fetch("/predict", { method: "POST", body: form });
    if (!r.ok) throw new Error((await r.json()).detail || `Server answered ${r.status}`);
    result = await r.json();
    if (originalUrl) URL.revokeObjectURL(originalUrl);
    originalUrl = URL.createObjectURL(blob);
    $("s-area").textContent = (result.foreground_ratio * 100).toFixed(1) + "%";
    $("s-size").textContent = `${result.width} × ${result.height}`;
    $("s-model").textContent = result.model_ms + " ms";
    $("s-total").textContent = result.total_ms + " ms";
    const dl = $("download");
    dl.href = "data:image/png;base64," + result.cutout_png;
    dl.setAttribute("aria-disabled", "false");
    status.textContent = result.pet_found ? "" : "No pet found. The model only knows cats and dogs.";
    render();
  } catch (err) {
    status.className = "status error";
    status.textContent = `Couldn't process this image: ${err.message}. Try a JPG or PNG under 15 MB.`;
  } finally {
    document.body.classList.remove("busy");
  }
}

function render() {
  if (!result) return;
  const stage = $("stage");
  stage.style.setProperty("--ratio", result.width / result.height);
  const png = (b64) => "data:image/png;base64," + b64;
  $("slider").hidden = view !== "compare";
  if (view === "compare") {
    // full (uncropped) cutout = original with alpha; build it client-side from original + mask
    stage.innerHTML = `<div class="frame compare checker">
        <img id="cut" alt="Pet with background removed">
        <div class="top"><img src="${originalUrl}" alt="Original photo"></div>
        <div class="handle"></div></div>`;
    maskedOriginal().then(url => { const c = $("cut"); if (c) c.src = url; });
  } else {
    const src = view === "overlay" ? png(result.overlay_png) : png(result.mask_png);
    stage.innerHTML = `<div class="frame"><img src="${src}" alt="${view === "overlay" ? "Pet highlighted in pink" : "Black and white mask"}"></div>`;
  }
}

async function maskedOriginal() {
  const load = (src) => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; });
  const [img, mask] = await Promise.all([load(originalUrl), load("data:image/png;base64," + result.mask_png)]);
  const c = document.createElement("canvas");
  c.width = mask.width; c.height = mask.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(mask, 0, 0);
  ctx.globalCompositeOperation = "source-in";   // keep original only where the mask is set...
  const m = ctx.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < m.data.length; i += 4) m.data[i + 3] = m.data[i];  // ...using mask brightness as alpha
  ctx.putImageData(m, 0, 0);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL();
}
</script>
</body>
</html>
